<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgroFix: registra una nueva máquina.">
    <title>AgroFix | Registrar máquina</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components/form.css">
    <link rel="stylesheet" href="../assets/css/components/panel.css">
</head>
<body class="panel-page">
    <main class="panel">
        <header class="panel__header">
            <h1 class="panel__title">Registrar máquina</h1>
            <a class="icon-btn" href="./maquinas.html" aria-label="Cerrar registro de máquina">
                <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </a>
        </header>

        <form class="panel__content" action="#" method="post">
            <div class="panel__body">
                <div class="field">
                    <label class="field__label" for="maq-codigo">Código</label>
                    <input class="field__control" id="maq-codigo" name="codigo" type="text" required maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="Ej.: FU-0H" aria-describedby="maq-codigo-hint">
                    <p class="field__hint" id="maq-codigo-hint">Identificador único que aparece en las tarjetas.</p>
                </div>

                <div class="field">
                    <label class="field__label" for="maq-nombre">Nombre</label>
                    <input class="field__control" id="maq-nombre" name="nombre" type="text" required maxlength="80" placeholder="Ej.: Fumigadora Jacto Arbus 400">
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="maq-tipo">Tipo</label>
                        <select class="field__control field__control--select" id="maq-tipo" name="tipo" required>
                            <option value="" disabled selected>Selecciona</option>
                            <option value="tractor">Tractor</option>
                            <option value="fumigadora">Fumigadora</option>
                            <option value="guadanadora">Guadañadora</option>
                            <option value="motobomba">Motobomba</option>
                            <option value="cosechadora">Cosechadora</option>
                            <option value="remolque">Remolque</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="field__label" for="maq-anio">
                            Año <span class="field__optional">(opcional)</span>
                        </label>
                        <input class="field__control" id="maq-anio" name="anio" type="number" inputmode="numeric" min="1950" max="2100" step="1" placeholder="Ej.: 2019">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="field__label" for="maq-horometro">Horómetro actual</label>
                        <div class="affix affix--end">
                            <input class="field__control" id="maq-horometro" name="horometro" type="number" inputmode="decimal" min="0" step="0.5" required placeholder="0">
                            <span class="affix__text" aria-hidden="true">h</span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label" for="maq-intervalo">Mantenimiento cada</label>
                        <div class="affix affix--end">
                            <input class="field__control" id="maq-intervalo" name="intervalo" type="number" inputmode="numeric" min="1" step="1" value="500" required aria-describedby="maq-intervalo-hint">
                            <span class="affix__text" aria-hidden="true">h</span>
                        </div>
                        <p class="field__hint" id="maq-intervalo-hint">Para calcular el próximo mantenimiento.</p>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="maq-notas">
                        Notas <span class="field__optional">(opcional)</span>
                    </label>
                    <textarea class="field__control field__control--textarea" id="maq-notas" name="notas" rows="3" maxlength="500" placeholder="Ej.: Ubicada en la finca La Esperanza"></textarea>
                </div>
            </div>

            <div class="panel__footer">
                <button class="btn btn--primary" type="submit">Registrar máquina</button>
            </div>
        </form>
    </main>
</body>
</html>
